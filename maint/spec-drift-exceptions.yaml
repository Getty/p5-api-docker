# Deliberate deviations between Docker's swagger and the generated model,
# read by maint/spec-drift-check.pl.
#
# Every entry here is a decision that has already been made, not a TODO. Say
# WHY -- a Changes bullet or a karr ticket -- so a later reader can tell a
# settled call apart from noise before touching it. The file is read as it
# is, with no merge against built-in defaults, so deleting an entry
# immediately surfaces whatever it was hiding.
#
# The checker derives almost everything structurally: which definitions are
# classes, which are scalars/arrays/maps, how `allOf` resolves, and what a
# field's type must be. Only the entries below cannot be derived.

# An inline object inside an ARRAY becomes a class named for one element, and
# making a plural singular is a judgement call, not a derivation. So is a
# property the swagger spells in lower case, which would otherwise give Perl a
# lower-case class name. Keyed by the dotted schema path; the generator
# refuses to write either shape unless it is named here, and every other
# inline class follows the mechanical rule (Mount.BindOptions ->
# API::Docker::Type::Mount::BindOptions).
#
# Entries whose name is unchanged are not redundant: they record that somebody
# looked and found the property name already right for a single element.
inline_class_names:
  ClusterVolume.PublishStatus:          API::Docker::Type::ClusterVolume::PublishStatus
  ClusterVolumeSpec.AccessMode.Secrets: API::Docker::Type::ClusterVolumeSpec::AccessMode::Secret
  EngineDescription.Plugins:            API::Docker::Type::EngineDescription::Plugin
  # `type: array` at the definition level, so the definition names the whole
  # array and the class is one element of it.
  GenericResources:                     API::Docker::Type::GenericResource
  # `rootfs` is the only lower-case one. RootFS, to match ImageInspect.RootFS
  # and the root_fs already in maint/spec-to-type-names.yaml.
  Plugin.Config.rootfs:                 API::Docker::Type::Plugin::Config::RootFS
  Resources.BlkioWeightDevice:          API::Docker::Type::Resources::BlkioWeightDevice
  Resources.Ulimits:                    API::Docker::Type::Resources::Ulimit
  Service.Endpoint.VirtualIPs:          API::Docker::Type::Service::Endpoint::VirtualIP
  SwarmSpec.CAConfig.ExternalCAs:       API::Docker::Type::SwarmSpec::CAConfig::ExternalCA
  SystemInfo.DefaultAddressPools:       API::Docker::Type::SystemInfo::DefaultAddressPool
  SystemVersion.Components:             API::Docker::Type::SystemVersion::Component
  TaskSpec.ContainerSpec.Configs:       API::Docker::Type::TaskSpec::ContainerSpec::Config
  TaskSpec.ContainerSpec.Secrets:       API::Docker::Type::TaskSpec::ContainerSpec::Secret
  TaskSpec.ContainerSpec.Ulimits:       API::Docker::Type::TaskSpec::ContainerSpec::Ulimit
  TaskSpec.Placement.Preferences:       API::Docker::Type::TaskSpec::Placement::Preference

# Classes the spec calls for that are deliberately not shipped. Matched as a
# literal prefix of the class name.
#
# Nothing is listed here yet, on purpose. The model is being written in one
# round (karr k79, decision 3) and the ~116 classes this report still calls
# missing are work that has not happened yet, not a decision -- suppressing
# them would hide the only number that says how far along the model is.
ignore_missing_classes: []

# A field in the spec this dist deliberately does not carry.
#   - class: API::Docker::Type::Something
#     field: SomeWireName
#     reason: ...
ignore_missing_fields: []

# A field this dist carries that the spec does not have. The place this will
# be needed is a field a real engine answers with and the swagger never
# documented -- record the engine and version that was measured on.
ignore_extra_fields: []

# A field whose type deliberately differs from the spec's. The skill lists
# the known cases (Created is an integer epoch from list and an RFC3339
# string from inspect; a swarm object's Version is a map, not a scalar);
# none of them is in the classes written so far.
ignore_type_mismatch: []

# A `since` annotation that deliberately differs from what diffing the specs
# in spec/ produces.
ignore_since: []

# Classes under API::Docker::Type:: with no counterpart in the spec at all.
perl_only: []
