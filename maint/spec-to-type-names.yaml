# The Perl attribute name for every swagger field whose name carries a run of
# two or more capitals. Read by maint/spec-to-type.pl.
#
# WHY THIS IS A FILE AND NOT AN ALGORITHM
#
# The generator derives a Perl name from a wire name mechanically -- insert an
# underscore before each capital that follows a lower-case letter or digit,
# lower-case the lot -- and that is right for the 568 of 638 field names that
# have no run of capitals in them. For the 70 listed here it is not, and the
# usual guard does not catch it: the round-trip test (derive back, compare)
# passes for `DeviceIDs -> device_i_ds` and `BlkioDeviceReadIOps ->
# blkio_device_read_i_ops`, which are both nonsense a reader would have to
# decode. Where a run of capitals ends and the next word begins is knowledge
# about English and about Docker, not about the string.
#
# So: a field name containing [A-Z]{2} that is NOT listed here makes the
# generator STOP, with the name in the message. Guessing quietly is exactly
# how `device_i_ds` would end up in a hundred and thirty classes at once.
#
# Keyed by the wire name, globally rather than per class, so one spelling
# means one Perl name everywhere in the model. The swagger is not consistent
# with itself -- `CPUShares` and `CpuShares`, `NanoCPUs` and `NanoCpus` are
# each two spellings of one field in two definitions -- and mapping both to
# the same Perl name is deliberate: the registry stores each class's own wire
# spelling verbatim, so nothing is lost on the wire and the Perl surface stops
# being a lottery.
#
# The generator emits an explicit `wire => '...'` on its own, for every name
# whose Perl form does not derive back to it. That part is mechanical and is
# not configured here.

BlkioDeviceReadIOps:    blkio_device_read_iops
BlkioDeviceWriteIOps:   blkio_device_write_iops
CACert:                 ca_cert
