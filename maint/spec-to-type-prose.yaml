# Prose a human wrote that the swagger does not contain, read by
# maint/spec-to-type.pl.
#
# The generator derives everything it honestly can: the provenance sentence,
# the ABSTRACT from the definition's own description, each =attr block from
# the field's description converted out of Markdown, the notes about an
# explicit wire spelling, an enumeration, caller-data keys, `required`, and a
# field that is an allOf around a scalar $ref. What it cannot derive is
# anything the swagger does not say -- what a type is FOR, what it is the
# element of, why a field's name had to be chosen by hand.
#
# That is what this file holds, and holding it in a file rather than only in
# the .pm is the point: it is the record of what curation a class has already
# had. Per class:
#
#   abstract:           the # ABSTRACT line. REQUIRED where the swagger gives
#                       the definition no description of its own -- the
#                       generator refuses to invent one.
#   description_append: sentences joined onto the provenance paragraph of the
#                       =head1 DESCRIPTION.
#   description_extra:  further paragraphs after it.
#   attr:
#     <perl_name>:
#       extra:          sentences appended to the field's description
#       replace:        the whole =attr block, where merging is hopeless
#
# Every entry below was written while the sixteen hand-written classes were,
# and is the reason `--verify` can reproduce them byte for byte. A newly
# generated class has no entry here at all; adding one is the curation step
# that follows generation.

API::Docker::Type::Port:
  description_append:
    - One entry of the C<Ports> array a container list answers with.
  attr:
    private_port:
      extra:
        - A C<uint16>.
    public_port:
      extra:
        - A C<uint16>.
    type:
      extra:
        - >-
          The protocol the port speaks, C<tcp> in the swagger's example for
          this object.

API::Docker::Type::PortBinding:
  description_append:
    - >-
      These are the values of a C<PortMap>, whose keys -- C<"80/tcp"> and the
      like -- are the caller's data and are never translated; see
      L<API::Docker::Type::HostConfig/port_bindings>.
  attr:
    host_ip:
      extra:
        - The swagger's example is C<127.0.0.1>.
    host_port:
      extra:
        - The swagger's example is C<"4443">. A string on the wire, not a number.

API::Docker::Type::ThrottleDevice:
  abstract: A per-device block IO rate limit
  attr:
    rate:
      extra:
        - >-
          What it counts depends on the field this device sits in: bytes per
          second under C<blkio_device_read_bps> and C<blkio_device_write_bps>,
          IO operations per second under C<blkio_device_read_iops> and
          C<blkio_device_write_iops>.

API::Docker::Type::DeviceMapping:
  description_append:
    - >-
      None of its three fields carries a description upstream; the example the
      swagger gives is C<< { PathOnHost: "/dev/deviceName", PathInContainer:
      "/dev/deviceName", CgroupPermissions: "mrw" } >>.
  attr:
    path_on_host:
      extra:
        - The device's path on the host, per the swagger's example.
    path_in_container:
      extra:
        - The path the device is to appear under inside the container, per the
          swagger's example.
    cgroup_permissions:
      extra:
        - The cgroup device permissions, C<"mrw"> in the swagger's example.

API::Docker::Type::DeviceRequest:
  attr:
    driver:
      extra:
        - The swagger's example is C<"nvidia">.
    count:
      extra:
        - The swagger's example is C<-1>.
    device_ids:
      extra:
        - The swagger's example is C<< ["0", "1",
          "GPU-fef8089b-4820-abfc-e83e-94318197576e"] >>.
    capabilities:
      extra:
        - >-
          An ArrayRef of ArrayRefs of strings: C<< [["gpu", "nvidia",
          "compute"]] >> asks for a device that has all three.

API::Docker::Type::Mount:
  abstract: One entry of a container's Mounts specification
  description_extra:
    - >-
      The four C<*Options> fields are objects the swagger writes inline rather
      than referencing, so each becomes a class named after this one:
      L<API::Docker::Type::Mount::BindOptions>,
      L<API::Docker::Type::Mount::VolumeOptions>,
      L<API::Docker::Type::Mount::ImageOptions> and
      L<API::Docker::Type::Mount::TmpfsOptions>.

API::Docker::Type::Mount::BindOptions:
  description_append:
    - >-
      Upstream it has no name of its own -- it is an object written straight
      into C<Mount>, and the class is named after the definition that declares
      it.

API::Docker::Type::Mount::VolumeOptions:
  attr:
    labels:
      extra:
        - A label named C<com.example.Some-Label> reaches the daemon spelled
          exactly that way.
    driver_config:
      replace: >-
        The volume driver to create the volume with, and its options. The
        swagger's description of this field, "Map of driver specific options",
        describes the driver's own options map rather than the object. See
        L<API::Docker::Type::Mount::VolumeOptions::DriverConfig>.

API::Docker::Type::Mount::VolumeOptions::DriverConfig:
  abstract: The volume driver a mount's volume is to be created with
  description_append:
    - >-
      where its description reads "Map of driver specific options" -- which
      describes L</options>, not the object, whose two fields are a driver
      name and that map.

API::Docker::Type::Mount::TmpfsOptions:
  attr:
    options:
      extra:
        - 'For example: C<< [["noexec"], ["size", "64m"]] >>.'

API::Docker::Type::Mount::ImageOptions:
  description_append:
    - The whole schema is newer than v1.44.

API::Docker::Type::Resources:
  description_extra:
    - >-
      L<API::Docker::Type::HostConfig> is C<allOf [ $ref Resources, ... ]> in
      the swagger and therefore inherits from this class, which is why every
      field below is also a field of a C<HostConfig>. C<TaskSpec> references
      the definition directly.

API::Docker::Type::Resources::BlkioWeightDevice:
  abstract: A per-device block IO weight
  description_append:
    - >-
      Neither the schema nor its two fields carry a description upstream; the
      form the swagger shows for the enclosing field is C<< [{"Path":
      "device_path", "Weight": weight}] >>.
  attr:
    path:
      extra:
        - The device path, per the swagger's example form.
    weight:
      extra:
        - >-
          The relative weight for that device; the swagger constrains it to 0
          or above and nothing else.

API::Docker::Type::Resources::Ulimit:
  abstract: One resource limit to set in a container
  description_append:
    - >-
      Upstream the schema has no name at all: the class name is this one place
      where the model does not follow from the spec mechanically, because
      C<Ulimits> had to be made singular by hand. The mapping is recorded in
      C<maint/spec-drift-exceptions.yaml>.
  attr:
    name:
      extra:
        - C<nofile> for instance.

API::Docker::Type::HostConfig:
  attr:
    port_bindings:
      extra:
        - >-
          In the swagger this is a C<$ref> to C<PortMap>, a definition that is
          nothing but C<additionalProperties>, so it becomes a hash here
          rather than a class of its own, and the daemon does answer with
          C<null> for a port that is exposed but not published.
    sysctls:
      extra:
        - 'The swagger''s example is C<< {"net.ipv4.ip_forward": "1"} >>.'

API::Docker::Type::HostConfig::LogConfig:
  attr:
    config:
      extra:
        - 'The swagger''s example is C<< {"max-file": "5", "max-size": "10m"} >>.'

# --- Classes the swagger describes nowhere -------------------------------
#
# Everything above this line was written while the seventeen hand-written
# classes were. What follows is the other half of the same job: the classes
# for which neither the definition, nor the property holding it, nor `paths:`,
# nor the field that references it says what the thing is. The generator
# refuses those, and these are the answers.

# The three streaming payloads. Nothing references them and no path names
# them as a schema, because they are the newline-delimited JSON objects the
# daemon writes into a response body rather than the body itself -- the
# reference documentation says so in prose, and this distribution's transport
# has been parsing them since before the type model existed (see
# API::Docker::Role::HTTP, which falls back to line-by-line NDJSON, and
# API::Docker::Error::Stream, which is croaked on the errorDetail one).
API::Docker::Type::BuildInfo:
  abstract: One event of the stream a C<POST /build> answers with
  description_append:
    - >-
      Nothing references it and no path names it as a schema, because it is
      not a response body: C<POST /build> answers C<200> and then writes one
      of these objects per line until the daemon closes the connection. A
      failed build is still C<200>, and arrives as an event carrying
      C<errorDetail>.
  attr:
    stream:
      extra:
        - >-
          The build log the way the daemon writes it, one line per event
          with the newline included -- C<< {"stream":"STEP 1/2: FROM
          alpine:3\n"} >> opens
          F<t/fixtures/images_build_stream.ndjson>. Nine of that capture's
          ten events are this field; the tenth is L</aux>.
    id:
      extra:
        - >-
          The build stream captured in F<t/fixtures/images_build_stream.ndjson>
          carries no C<id> at all. The same field on a pull,
          L<API::Docker::Type::CreateImageInfo/id>, names the layer each event
          is about.
    status:
      extra:
        - >-
          The same phase line a pull reports through
          L<API::Docker::Type::CreateImageInfo/status>; the captured build
          stream carries L</stream> instead and no C<status> at all.
    progress_detail:
      extra:
        - >-
          The numbers behind L</progress>, which the swagger describes as a
          pre-formatted presentation of this field.
    error_detail:
      extra:
        - >-
          The failure, structured. The C<error> field beside it carries the
          same text and the swagger deprecates it in favour of this one:
          F<t/fixtures/images_build_error_stream.ndjson> ends with both,
          spelling C<"building at STEP \"RUN exit 7\": while running runtime:
          exit status 7"> twice.
API::Docker::Type::CreateImageInfo:
  abstract: One event of the stream a C<POST /images/create> answers with
  description_append:
    - >-
      The pull progress stream: C<POST /images/create> answers C<200> and then
      writes one of these objects per line. Like a build, a failed pull is
      still C<200> and reports itself through C<errorDetail>.
  attr:
    id:
      extra:
        - >-
          Which layer the event is about: a short image ID, repeated across
          every event for that layer. F<t/fixtures/images_pull_stream.ndjson>
          carries C<55afa1ecc21d> once and C<d529dd0c6e55> on three
          consecutive events.
    status:
      extra:
        - >-
          The phase the layer named by L</id> has reached, as text. The
          captured pull in F<t/fixtures/images_pull_stream.ndjson> carries
          C<"Already exists">, C<"Pulling fs layer"> and C<"Download
          complete">.
    progress_detail:
      extra:
        - >-
          The numbers behind L</progress>, which the swagger describes as a
          pre-formatted presentation of this field. Empty in all four events
          of F<t/fixtures/images_pull_stream.ndjson>, which had nothing left
          to transfer.
    error_detail:
      extra:
        - >-
          The failure, structured; the C<error> field beside it carries the
          same text and the swagger deprecates it in favour of this one. A
          failed pull is still C<200>, so this is the verdict -- see
          L<API::Docker::Error::Stream>.
API::Docker::Type::PushImageInfo:
  abstract: One event of the stream a C<POST /images/{name}/push> answers with
  description_append:
    - >-
      The push progress stream, the same shape as a pull's. A failed push is
      C<200> with an C<errorDetail> event, so the status line is not the
      verdict.
  attr:
    status:
      extra:
        - >-
          The phase line, the same shape a pull's
          L<API::Docker::Type::CreateImageInfo/status> carries. No push stream
          is captured under F<t/fixtures/> -- pushing publishes to a real
          registry, so this distribution does not run one.
    progress_detail:
      extra:
        - >-
          The numbers behind L</progress>, which the swagger describes as a
          pre-formatted presentation of this field.
    error_detail:
      extra:
        - >-
          The failure, structured; the C<error> field beside it carries the
          same text and the swagger deprecates it in favour of this one. See
          L<API::Docker::Error::Stream>.

# Inline objects the swagger writes without a description, and whose property
# carries none either. The class name is the only thing the spec offers, so
# these say what the fields are rather than inventing a purpose for them.
API::Docker::Type::GenericResource::DiscreteResourceSpec:
  abstract: An integer-valued user-defined resource
  description_append:
    - The C<Kind>/C<Value> pair for a countable resource, C<SSD=3> in the
      swagger's example.
  attr:
    kind:
      extra:
        - The resource's name, C<SSD> in that example.
    value:
      extra:
        - How many there are, C<3> in that example.
API::Docker::Type::GenericResource::NamedResourceSpec:
  abstract: A string-valued user-defined resource
  description_append:
    - The C<Kind>/C<Value> pair for a named resource, C<GPU=UUID1> in the
      swagger's example.
  attr:
    kind:
      extra:
        - The resource's name, C<GPU> in that example.
    value:
      extra:
        - >-
          The name of the one unit, C<UUID1> in that example. The example
          carries two such objects, C<UUID1> and C<UUID2>, rather than one
          object listing both -- a node advertising two GPUs advertises two
          entries.
API::Docker::Type::ImageManifestSummary::Size:
  abstract: The sizes of one manifest of an image
  description_append:
    - Two byte counts, C<Content> and C<Total>.
API::Docker::Type::ImageManifestSummary::ImageData::Size:
  abstract: The unpacked size of an image manifest
  description_append:
    - One byte count, C<Unpacked>.
API::Docker::Type::Plugin::Config::Args:
  abstract: The command-line arguments a plugin accepts
  attr:
    name:
      extra:
        - >-
          C<args> in the swagger's example -- the whole command line is one
          named item, not one item per argument.
    description:
      extra:
        - C<"command line arguments"> in the swagger's example.
    settable:
      extra:
        - >-
          An array of strings, and the swagger never says what they hold. What
          a user changes on an installed plugin goes in through C<POST
          /plugins/{name}/set> and comes back out under
          L<API::Docker::Type::Plugin/settings>.
    value:
      extra:
        - The arguments themselves, one string each.
API::Docker::Type::Plugin::Config::Linux:
  abstract: The Linux-specific capabilities and devices a plugin needs
  attr:
    capabilities:
      extra:
        - >-
          The Linux capabilities the plugin's process needs, C<CAP_SYS_ADMIN>
          and C<CAP_SYSLOG> in the swagger's example.
    allow_all_devices:
      extra:
        - >-
          A boolean, C<false> in the swagger's example, required beside the
          explicit L</devices> list.
    devices:
      extra:
        - The device list that stands beside L</allow_all_devices>.
API::Docker::Type::Plugin::Config::Network:
  abstract: The network mode a plugin runs in
  attr:
    type:
      extra:
        - The object's only field; C<host> in the swagger's example.
API::Docker::Type::Plugin::Config::RootFS:
  abstract: The root filesystem of a plugin
  description_append:
    - >-
      The two fields are spelled in lower case upstream, C<type> and
      C<diff_ids>, and the property itself is C<rootfs>; the class is named
      C<RootFS> to match C<ImageInspect.RootFS>, which is recorded in
      C<maint/spec-drift-exceptions.yaml>.
  attr:
    type:
      extra:
        - >-
          C<layers> in the swagger's example, the same value an image answers
          with under L<API::Docker::Type::ImageInspect::RootFS/type>.
    diff_ids:
      extra:
        - >-
          One C<sha256:...> digest per layer, two of them in the swagger's
          example -- what L<API::Docker::Type::ImageInspect::RootFS/layers>
          holds for an image.
API::Docker::Type::Plugin::Config::User:
  abstract: The user and group a plugin's process runs as
  attr:
    uid:
      extra:
        - A C<uint32>; the swagger's example is C<1000>.
    gid:
      extra:
        - A C<uint32> too, C<1000> in the same example.
API::Docker::Type::Service::Endpoint:
  abstract: The resolved endpoint of a service
  description_append:
    - >-
      The specification a service was asked for, alongside the ports and
      virtual IPs the swarm actually gave it.
  attr:
    ports:
      extra:
        - >-
          The ports as published. In the swagger's C<Service> example they are
          the very entry C<Spec.Ports> asked for -- C<tcp>, target C<6379>,
          published C<30001>.
    virtual_ips:
      extra:
        - >-
          One entry per virtual IP the routing mesh gave the service. The
          swagger's C<Service> example carries two, C<10.255.0.2/16> and
          C<10.255.0.3/16>, both on the same network.
API::Docker::Type::ServiceSpec::Mode::Replicated:
  abstract: The replicated mode of a service, and its replica count
  attr:
    replicas:
      extra:
        - >-
          How many tasks the service should be running; C<1> in the swagger's
          C<Service> example, whose one task carries
          L<API::Docker::Type::Task/slot> C<1>.
API::Docker::Type::SystemVersion::Platform:
  abstract: The name of the platform the daemon reports itself as
  attr:
    name:
      extra:
        - >-
          What the engine calls itself, and the two answers are nothing alike:
          F<t/fixtures/system_version.json>, captured from Docker 27.4.1,
          carries C<"Docker Engine - Community">, while Podman 5.8.4 (API
          1.44) answers C<"linux/amd64/debian-13">. Free text, not a token to
          branch on.
API::Docker::Type::TaskSpec::Placement:
  abstract: Where in the swarm a task may be scheduled
  description_append:
    - >-
      Hard constraints, soft preferences, the platforms the task can run on,
      and a cap on how many replicas one node may take.
API::Docker::Type::TaskSpec::Placement::Preference:
  abstract: One scheduling preference of a task
  attr:
    spread:
      extra:
        - >-
          The only kind of preference the swagger defines, and the only field
          of this object. Its own C<SpreadDescriptor> is described upstream as
          a label descriptor; the example under
          L<API::Docker::Type::TaskSpec::Placement/preferences> spreads over
          C<node.labels.datacenter> first and C<node.labels.rack> second,
          preferences being listed from highest precedence to lowest.
API::Docker::Type::TaskSpec::Placement::Preference::Spread:
  abstract: The node attribute a task is spread over

# --- Fields the swagger leaves undescribed --------------------------------
#
# The generator's curation list ends with the fields whose schema carries no
# `description` at all. Each renders as `Undocumented upstream.` and nothing
# more, which is honest and tells a reader nothing. What follows says what
# such a field is, taken -- in this order -- from the spec itself somewhere
# else (the same wire name described under another definition, the `example`
# of the property, or the example response of the path that answers it), from
# a read-only measurement against a real engine, or from what this
# distribution already has on record.
#
# `Undocumented upstream.` stays alone wherever none of the three produced
# anything. An invented sentence here would read exactly like a measured one,
# which makes it worse than the admission.
#
# The curation list does not shrink as entries are added: it reports what the
# swagger says, and the swagger still says nothing. What shrinks is the set of
# =attr blocks that stop at the admission.

API::Docker::Type::ContainerState:
  attr:
    dead:
      extra:
        - >-
          The boolean beside L</status>'s C<dead> value, as L</running>,
          L</paused> and L</restarting> stand beside theirs. The swagger's
          example is C<false>.

API::Docker::Type::EndpointSettings:
  attr:
    links:
      extra:
        - >-
          Container links for this endpoint. The swagger describes the same
          field name under L<API::Docker::Type::HostConfig/links> as a list of
          links in the form C<container_name:alias>; the example given here is
          the bare C<< ["container_1", "container_2"] >>.
    aliases:
      extra:
        - >-
          The network aliases of this endpoint. L</dns_names> names them as
          one of the four things an endpoint's DNS names are built from --
          the container name, its network aliases, its short ID and its
          hostname. The swagger's example is C<< ["server_x", "server_y"] >>.

API::Docker::Type::EndpointIPAMConfig:
  attr:
    ipv4_address:
      extra:
        - >-
          An IPv4 address for the endpoint, C<172.20.30.33> in the swagger's
          example. This is the address configured; the one the endpoint ends
          up with is reported separately as
          L<API::Docker::Type::EndpointSettings/ip_address>.
    ipv6_address:
      extra:
        - >-
          The IPv6 counterpart of L</ipv4_address>, C<2001:db8:abcd::3033> in
          the swagger's example.
    link_local_ips:
      extra:
        - >-
          Link-local addresses for the endpoint. The swagger's example holds
          one of each family, C<< ["169.254.34.68", "fe80::3468"] >>.

API::Docker::Type::ImageInspect::RootFS:
  attr:
    type:
      extra:
        - >-
          How the root filesystem is stored. C<layers> is the only value the
          swagger shows, and the only one measured: C<GET /images/{id}/json>
          on Podman 5.8.4 (API 1.44) answers C<"Type": "layers">.
    layers:
      extra:
        - >-
          One diff ID per layer of the image. Measured against Podman 5.8.4
          (API 1.44), a Debian-based image answers eight C<sha256:...>
          digests here; the swagger's example shows two of the same form.

API::Docker::Type::ImageHistoryResponseItem:
  description_append:
    - >-
      The swagger describes none of the six fields, but the example response
      it gives for C<GET /images/{name}/history> shows all six across three
      layers. That example is not the last word: measured against Podman
      5.8.4 (API 1.44), a locally built image answers ten entries that
      contradict it on three of the six, so L</id>, L</tags> and L</comment>
      each say what the spec shows and what the engine sent.
  attr:
    id:
      extra:
        - >-
          The swagger's example response spells this as a bare hex digest
          with no C<sha256:> prefix. The engine does not. Measured against
          Podman 5.8.4 (API 1.44), a locally built image answers ten entries
          of which exactly one -- the image's own top layer -- carries a real
          C<sha256:...> digest; the other nine carry the literal string
          C<< sha256:<missing> >>, which is a marker and not an ID. Handing
          that to C<GET /images/{id}/json> looks up nothing, so test for it
          before treating this field as a reference to anything.
    created:
      extra:
        - >-
          A Unix timestamp in seconds -- C<1398108230> in the swagger's
          example response, the same form the spec spells out for
          L<API::Docker::Type::ImageSummary/created>, and the form measured
          against Podman 5.8.4 (API 1.44), which answers C<1787794246> for
          the top layer of a locally built image.
    created_by:
      extra:
        - >-
          What created the layer, C<< "/bin/sh -c #(nop) ADD file:eb15... in
          /" >> in the swagger's example response. Measured against Podman
          5.8.4 (API 1.44), one response mixes two forms: that C<< "/bin/sh
          -c ..." >> shell wrapping on the older layers, and bare Dockerfile
          instructions on the ones a BuildKit build produced -- C<< CMD
          ["perl5.40.5" "-de0"] >>, C<WORKDIR /usr/src/app>, C<< COPY
          *.patch /usr/src/perl/ # buildkit >>. Do not parse it expecting
          either one.
    tags:
      extra:
        - >-
          The image names pointing at this layer, C<< ["ubuntu:lucid",
          "ubuntu:10.04"] >> in the swagger's example response, which writes
          C<[]> for a layer that has none. The engine writes C<null> there
          instead: measured against Podman 5.8.4 (API 1.44), all ten entries
          of an untagged image answer C<null>. An empty list is not what an
          absent tag looks like on the wire.
    size:
      extra:
        - >-
          The layer's size in bytes: C<182964289> for the one that adds the
          root filesystem in the swagger's example response, C<0> for the two
          that only carry metadata. Measured against Podman 5.8.4 (API 1.44),
          the ten entries of one locally built image run from C<0> to
          C<410969600>, and C<0> is not reserved for metadata layers -- a
          C<#(nop) COPY> among them reports C<4262912>.
    comment:
      extra:
        - >-
          The message set when the layer was committed or imported, which is
          what L<API::Docker::Type::ImageInspect/comment> describes for a
          whole image. The swagger's example response leaves it empty on two
          layers and gives C<"Imported from -"> on the third. Measured
          against Podman 5.8.4 (API 1.44) it is always present, never absent,
          and where the layer has a provenance it carries that: on one
          locally built image, C<"buildkit.dockerfile.v0"> on five entries,
          C<"debuerreotype 0.17"> on the base layer, C<< "FROM
          docker.io/library/perl:5.40-slim" >> on one more, and the empty
          string on the remaining three.

API::Docker::Type::ImageID:
  description_append:
    - >-
      The only C<$ref> to it in the whole spec is C<BuildInfo.aux>, so this is
      the object a build stream reports the finished image's ID in; see
      L<API::Docker::Type::BuildInfo/aux>.
  attr:
    id:
      extra:
        - >-
          The image ID or digest the definition's own description names. The
          swagger's example is
          C<sha256:85f05633ddc1c50679be2b16a0479ab6f7637f8884e0cfe0f4d20e1ebb3d6e7c>.

API::Docker::Type::ImageManifestSummary:
  attr:
    size:
      extra:
        - >-
          Two byte counts: C<Content> for what of this manifest and its
          children is in the local content store, C<Total> for that plus every
          other locally present byte belonging to it.

API::Docker::Type::ImageManifestSummary::ImageData:
  attr:
    size:
      extra:
        - >-
          One byte count, C<Unpacked>: the unpacked, uncompressed image
          content a container running this image uses.

API::Docker::Type::Network:
  attr:
    ipam:
      extra:
        - >-
          The network's address management -- which IPAM driver, that driver's
          options, and the pools it allocates from. Measured against Podman
          5.8.4 (API 1.44), the default bridge answers C<< {"Driver":
          "default", "Options": {"driver": "host-local"}, "Config":
          [{"Subnet": "10.88.0.0/16", "Gateway": "10.88.0.1"}]} >>.

API::Docker::Type::NetworkContainer:
  description_append:
    - >-
      The keys of that map are container IDs, and the swagger describes the
      field holding it as containing the endpoints attached to the network.
  attr:
    name:
      extra:
        - The container's name, C<container_1> in the swagger's example.
    endpoint_id:
      extra:
        - >-
          The endpoint's ID, the value the swagger describes under
          L<API::Docker::Type::EndpointSettings/endpoint_id> as unique for a
          service endpoint in a sandbox.
    mac_address:
      extra:
        - >-
          The endpoint's MAC address on this network, which the swagger notes
          under L<API::Docker::Type::EndpointSettings/mac_address> a network
          driver may ignore.
    ipv4_address:
      extra:
        - >-
          The address with its prefix length, C<172.19.0.2/16> in the
          swagger's example -- not the bare address
          L<API::Docker::Type::EndpointSettings/ip_address> carries.
    ipv6_address:
      extra:
        - >-
          The IPv6 counterpart of L</ipv4_address>, empty in the swagger's
          example, where the network has none.

API::Docker::Type::IPAMConfig:
  description_append:
    - >-
      Neither the definition nor any of its four fields carries a description,
      but L<API::Docker::Type::IPAM/config> writes out the map form an entry
      takes: C<< {"Subnet": <CIDR>, "IPRange": <CIDR>, "Gateway": <IP
      address>, "AuxAddress": <device_name:IP address>} >>. That is where the
      four sentences below come from.
  attr:
    subnet:
      extra:
        - >-
          A CIDR block. Measured against Podman 5.8.4 (API 1.44), the default
          bridge network answers C<10.88.0.0/16>; the swagger's example is
          C<172.20.0.0/16>.
    ip_range:
      extra:
        - >-
          A CIDR block inside L</subnet>, C<172.20.10.0/24> against a
          C<172.20.0.0/16> subnet in the swagger's examples.
    gateway:
      extra:
        - >-
          An IP address. Measured against Podman 5.8.4 (API 1.44), the default
          bridge network answers C<10.88.0.1>; the swagger's example is
          C<172.20.10.11>.
    auxiliary_addresses:
      extra:
        - >-
          A device name for each key and an IP address for each value, which
          is what C<< "AuxAddress": <device_name:IP address> >> in
          L<API::Docker::Type::IPAM/config> spells out.

API::Docker::Type::AuthConfig:
  attr:
    username:
      extra:
        - >-
          The registry account name, C<hannibal> in the definition's own
          example.
    password:
      extra:
        - >-
          Its password, C<xxxx> in the definition's own example. The swagger's
          introduction gives the same three keys as the structure that travels
          base64url-encoded in C<X-Registry-Auth>, and notes that an identity
          token from C<POST /auth> can be sent instead of a username and
          password; see L<API::Docker::Role::RegistryAuth>.
    serveraddress:
      extra:
        - >-
          The registry to authenticate against. The swagger's introduction
          says of this key that it is "a domain/IP without a protocol", while
          the definition's own example gives
          C<https://index.docker.io/v1/> -- which has one. The spec
          contradicts itself here; this distribution forwards whatever the
          caller wrote.

API::Docker::Type::ErrorDetail:
  description_append:
    - >-
      It is what a build, pull or push stream reports a failure through, and
      what L<API::Docker::Error::Stream> is croaked on; neither of its two
      fields is described either.
  attr:
    message:
      extra:
        - >-
          The reason, as text. It ends in a newline in
          F<t/fixtures/images_build_error_stream.ndjson>, which is why
          L<API::Docker::Error::Stream/message> strips trailing whitespace
          before Carp sees it.
    code:
      extra:
        - >-
          An integer. No captured stream under F<t/fixtures/> carries one --
          the C<errorDetail> of F<t/fixtures/images_build_error_stream.ndjson>
          has L</message> and nothing else.

API::Docker::Type::ProgressDetail:
  description_append:
    - >-
      The two numbers behind the C<progress> field of a build, pull or push
      event, which the swagger describes as "a pre-formatted presentation of
      progressDetail".
  attr:
    current:
      extra:
        - >-
          How much is done. Absent from every event of
          F<t/fixtures/images_pull_stream.ndjson>, where C<progressDetail> is
          an empty object throughout.
    total:
      extra:
        - How much there is to do, the other half of L</current>.

API::Docker::Type::BuildCache:
  attr:
    usage_count:
      extra:
        - >-
          A count of uses, C<26> in the swagger's example. The record's two
          other usage fields, L</in_use> and L</last_used_at>, are described
          upstream; this one is not.

API::Docker::Type::SystemVersion:
  attr:
    platform:
      extra:
        - >-
          One field, a name the engine gives itself. What the two engines put
          in it has nothing in common; see
          L<API::Docker::Type::SystemVersion::Platform/name>.

API::Docker::Type::RegistryServiceConfig:
  attr:
    index_configs:
      extra:
        - >-
          One L<API::Docker::Type::IndexInfo> per registry the daemon knows,
          keyed by the registry's own name -- C<docker.io>,
          C<127.0.0.1:5000> and C<< [2001:db8:a0b:12f0::1]:80 >> among the
          swagger's examples. L</insecure_registry_cidrs> describes this map
          as where a registry marked insecure by hostname is listed, with its
          C<Secure> set to false. Measured against Podman 5.8.4 (API 1.44),
          C<GET /info> answers an empty map here.

API::Docker::Type::ProcessConfig:
  description_append:
    - >-
      The swagger describes none of its five fields, but the example response
      it gives for that endpoint shows all five, and the body of C<POST
      /containers/{id}/exec> describes the options they report back.
  attr:
    privileged:
      extra:
        - >-
          Whether the process runs with extended privileges, which is how the
          swagger describes C<Privileged> on the exec-create body. C<false> in
          the example response.
    user:
      extra:
        - >-
          The user, and optionally the group, the process runs as inside the
          container -- one of C<user>, C<user:group>, C<uid> or C<uid:gid>, as
          the swagger describes C<User> on the exec-create body. C<"1000"> in
          the example response.
    tty:
      extra:
        - >-
          Whether a pseudo-TTY was allocated, which is what C<Tty> asks for on
          the exec-create body. It decides how the output arrives: with a TTY
          the stream is raw, without one it is the multiplexed frame format,
          see L<API::Docker::Role::HTTP/"Detecting a framed stream">. C<true>
          in the example response.
    entrypoint:
      extra:
        - >-
          The program being run, C<"sh"> in the example response. The
          exec-create body takes it together with L</arguments> as one C<Cmd>,
          which the swagger describes as the command to run.
    arguments:
      extra:
        - >-
          Its arguments, C<< ["-c", "exit 2"] >> beside that C<"sh"> in the
          example response.

API::Docker::Type::ContainerBlkioStatEntry:
  attr:
    major:
      extra:
        - >-
          With L</minor>, the pair identifying the block device the entry
          counts for. The example L<API::Docker::Type::ContainerBlkioStats>
          gives for a whole object holds two entries under
          C<io_service_bytes_recursive>, one read and one write, and both
          carry C<254> here.
    minor:
      extra:
        - The other half of that pair, C<0> on both of those entries.
    op:
      extra:
        - >-
          The operation counted, C<"read"> on one of those two entries and
          C<"write"> on the other. The type holding them describes itself as
          storing all IO service stats for data read and write.
    value:
      extra:
        - >-
          The count itself. What it counts depends on which of the eight
          arrays of L<API::Docker::Type::ContainerBlkioStats> the entry sits
          in; under C<io_service_bytes_recursive> it is bytes, C<7593984> on
          the read entry of that object's example and C<100> on the write
          one.

API::Docker::Type::ContainerBlkioStats:
  attr:
    io_service_bytes_recursive:
      extra:
        - >-
          Bytes transferred, one entry per device and operation. It is the
          only one of the eight arrays a cgroup v2 host fills in, which is
          also why it is the only one carrying no description: the other seven
          each say they are cgroup v1 only, and this one had nothing left to
          qualify.

API::Docker::Type::ContainerStorageStats:
  description_append:
    - >-
      None of its four fields is described. They are two counts and two byte
      totals, one pair per direction, every one of them nullable and every one
      of them given C<7593984> as its example.
  attr:
    read_count_normalized:
      extra:
        - >-
          The count of the read pair, beside the byte total in
          L</read_size_bytes>.
    read_size_bytes:
      extra:
        - The bytes read, the other half of that pair.
    write_count_normalized:
      extra:
        - The write counterpart of L</read_count_normalized>.
    write_size_bytes:
      extra:
        - The write counterpart of L</read_size_bytes>.

API::Docker::Type::Plugin:
  description_append:
    - >-
      Nothing in this class or in the ones hanging off it is backed by a
      measurement. Rootless Podman serves no plugin route at all, so on the
      engine this distribution measures against there is nothing here to
      observe; see L<API::Docker::API::Plugins/"Not available on Podman">.
      Everything below is read off the swagger's own examples.
  attr:
    id:
      extra:
        - >-
          The plugin's own ID, a 64-character hex digest in the swagger's
          example. The C</plugins/{name}/...> endpoints address a plugin by
          L</name>, not by this.
    name:
      extra:
        - >-
          The plugin's reference, C<tiborvass/sample-volume-plugin> in the
          swagger's example, and what the C</plugins/{name}/...> endpoints
          take in their path -- where the swagger notes the C<:latest> tag is
          optional and the default when omitted. L</plugin_reference> is the
          full remote reference the plugin was pushed or pulled under.

API::Docker::Type::Plugin::Config:
  attr:
    description:
      extra:
        - >-
          The plugin's own one-line description, C<"A sample volume plugin for
          Docker"> in the swagger's example.
    documentation:
      extra:
        - >-
          A URL, C<https://docs.docker.com/engine/extend/plugins/> in the
          swagger's example.
    entrypoint:
      extra:
        - >-
          The command the plugin's process is started with, one string per
          argument: C<< ["/usr/bin/sample-volume-plugin", "/data"] >> in the
          swagger's example.
    work_dir:
      extra:
        - >-
          The working directory that process starts in, C<"/bin/"> in the
          swagger's example.
    user:
      extra:
        - >-
          Two C<uint32>s, both C<1000> in the swagger's example.
    network:
      extra:
        - One field, a network mode; C<host> in the swagger's example.
    linux:
      extra:
        - >-
          The Linux capabilities the plugin needs, whether it may use every
          device, and the devices it declares by hand.
    propagated_mount:
      extra:
        - >-
          A path, C<"/mnt/volumes"> in the swagger's example. That example is
          all the swagger offers about it.
    mounts:
      extra:
        - >-
          The mounts the plugin declares. L<API::Docker::Type::Plugin/settings>
          carries the same list as it stands after a user has changed it.
    env:
      extra:
        - >-
          The environment variables the plugin declares, each an object with
          its own description and value: the swagger's example is a single
          C<DEBUG>, "if set, prints debug messages", currently C<"0">.
          L<API::Docker::Type::Plugin::Settings/env> carries the same
          variables as bare C<NAME=value> strings.
    args:
      extra:
        - >-
          The plugin's command line as one named item -- C<args>, "command
          line arguments", in the swagger's example -- not one item per
          argument.
    rootfs:
      extra:
        - >-
          A type and a list of layer digests, both spelled in lower case
          upstream.

API::Docker::Type::Plugin::Config::Interface:
  attr:
    types:
      extra:
        - >-
          The plugin API contracts the plugin implements. The swagger's
          example is the bare string C<docker.volumedriver/1.0> even though
          the items are objects, and its three parts line up with the
          C<Prefix>, C<Capability> and C<Version> of the class each item
          actually is, in that order.
    socket:
      extra:
        - >-
          The socket the engine reaches the plugin over, C<plugins.sock> in
          the swagger's example -- a name, not a path.

API::Docker::Type::Plugin::Settings:
  attr:
    mounts:
      extra:
        - >-
          The plugin's mounts as they now stand;
          L<API::Docker::Type::Plugin::Config/mounts> is the same list as the
          plugin declared it.
    env:
      extra:
        - >-
          The environment as bare C<NAME=value> strings, C<< ["DEBUG=0"] >> in
          the swagger's example -- the shape C<POST /plugins/{name}/set> takes
          in its body, whose own example is C<< ["DEBUG=1"] >>.
          L<API::Docker::Type::Plugin::Config/env> carries the same variables
          as objects with their descriptions.
    args:
      extra:
        - >-
          The command line as bare strings, against the single named item
          L<API::Docker::Type::Plugin::Config/args> declares.
    devices:
      extra:
        - >-
          The plugin's devices as they now stand;
          L<API::Docker::Type::Plugin::Config::Linux/devices> is the declared
          list.

API::Docker::Type::PluginMount:
  attr:
    name:
      extra:
        - C<"some-mount"> in the swagger's example.
    description:
      extra:
        - >-
          C<"This is a mount that's used by the plugin."> in the swagger's
          example.
    settable:
      extra:
        - >-
          An array of strings, and the swagger never says what they hold. What
          a user changes on an installed plugin goes in through C<POST
          /plugins/{name}/set> and comes back out under
          L<API::Docker::Type::Plugin/settings>.
    source:
      extra:
        - >-
          Where the mount comes from on the host, C<"/var/lib/docker/plugins/">
          in the swagger's example -- what
          L<API::Docker::Type::Mount/source> is for a container.
    destination:
      extra:
        - >-
          Where it appears inside the plugin, C<"/mnt/state"> in the swagger's
          example -- what L<API::Docker::Type::Mount/target> is for a
          container.
    type:
      extra:
        - >-
          C<"bind"> in the swagger's example. The container-side field this
          mirrors, L<API::Docker::Type::Mount/type>, is an enumeration the
          swagger describes value by value; this one is a bare string.
    options:
      extra:
        - >-
          Mount options, one string each: C<< ["rbind", "rw"] >> in the
          swagger's example.

API::Docker::Type::PluginDevice:
  attr:
    settable:
      extra:
        - >-
          An array of strings, and the swagger never says what they hold. What
          a user changes on an installed plugin goes in through C<POST
          /plugins/{name}/set> and comes back out under
          L<API::Docker::Type::Plugin/settings>.
    path:
      extra:
        - The device node, C<"/dev/fuse"> in the swagger's example.

API::Docker::Type::PluginEnv:
  description_append:
    - >-
      None of its four fields is described, but the example the swagger gives
      for that field shows all four at once: C<Name> C<"DEBUG">,
      C<Description> C<"If set, prints debug messages">, C<Settable> C<null>
      and C<Value> C<"0">.
  attr:
    name:
      extra:
        - The variable's name, C<"DEBUG"> in that example.
    description:
      extra:
        - >-
          What setting it does, C<"If set, prints debug messages"> in that
          example.
    settable:
      extra:
        - >-
          An array of strings, C<null> in that example, and the swagger never
          says what they hold. What a user changes on an installed plugin goes
          in through C<POST /plugins/{name}/set> and comes back out under
          L<API::Docker::Type::Plugin/settings>.
    value:
      extra:
        - >-
          The value it currently has, C<"0"> in that example -- a string, even
          where it reads as a number.

API::Docker::Type::PluginInterfaceType:
  description_append:
    - >-
      The example the swagger gives for that field is the bare string
      C<docker.volumedriver/1.0> rather than an object, and its three parts
      line up with the three fields below in the order they appear.
  attr:
    prefix:
      extra:
        - C<docker> in that example.
    capability:
      extra:
        - C<volumedriver> in that example.
    version:
      extra:
        - C<1.0> in that example.

API::Docker::Type::PluginPrivilege:
  attr:
    name:
      extra:
        - >-
          What the permission is over, C<network> in the swagger's example.
    value:
      extra:
        - >-
          What is being asked for, one string each: C<< ["host"] >> beside
          that C<network> in the swagger's example.

API::Docker::Type::GenericResource:
  attr:
    discrete_resource_spec:
      extra:
        - >-
          The C<Kind>/C<Value> pair when the resource counts, which the
          enclosing C<GenericResources> calls an Integer resource: C<SSD=3> in
          its example.
    named_resource_spec:
      extra:
        - >-
          The pair when the resource is named, which the enclosing
          C<GenericResources> calls a String resource: C<GPU=UUID1> in its
          example.

API::Docker::Type::ObjectVersion:
  attr:
    index:
      extra:
        - >-
          The version number itself, the one the definition above says must
          travel back with a modified specification so that two updates from
          the same base version cannot overwrite each other. The swagger's
          example is C<373531>; the C<GET /secrets> capture in
          F<t/fixtures/secrets_list.json>, from Podman 5.4.2 (API 1.41), has
          C<1> on both secrets. L<API::Docker::Role::Entity::Secret> and
          L<API::Docker::Role::Entity::Config> read it out as
          C<version_index>.

API::Docker::Type::Secret:
  attr:
    id:
      extra:
        - >-
          The secret's ID. The swagger's example is a 25-character Swarm ID,
          C<blt1owaxmitz71s9v5zh81zun>; the C<GET /secrets> capture in
          F<t/fixtures/secrets_list.json>, from Podman 5.4.2 (API 1.41),
          answers 25 hex characters instead.
    created_at:
      extra:
        - >-
          RFC 3339 with nanoseconds, C<2017-07-20T13:55:28.678958722Z> in the
          swagger's example.
    updated_at:
      extra:
        - >-
          The same format as L</created_at>, and identical to it on a secret
          that has never been updated -- both captured secrets in
          F<t/fixtures/secrets_list.json> carry the same instant in both
          fields.
    spec:
      extra:
        - >-
          The secret's name, driver and labels. Not its value: the daemon
          hands that to containers and never back over C</secrets>, so
          C<< $secret->spec->data >> reads C<undef> on anything an engine
          sent; L<API::Docker::Role::Entity::Secret> says why.

API::Docker::Type::Config:
  description_append:
    - >-
      The same four fields and the same C<Version> a secret carries, and the
      swagger gives an example for none of them; L<API::Docker::Type::Secret>
      is where the shapes are written down.
  attr:
    id:
      extra:
        - The config's ID, as L<API::Docker::Type::Secret/id> is a secret's.
    created_at:
      extra:
        - RFC 3339, as L<API::Docker::Type::Secret/created_at> is.
    updated_at:
      extra:
        - The same format as L</created_at>.
    spec:
      extra:
        - >-
          The config's name, labels, templating and -- unlike a secret's --
          its actual data, which the daemon does hand back.
          L<API::Docker::Role::Entity::Config/decoded_data> is the accessor
          that base64-decodes it.

API::Docker::Type::ClusterVolume:
  attr:
    created_at:
      extra:
        - >-
          A C<dateTime>, with no example given. Cluster volumes are Swarm
          objects, which is what L</id> says makes them carry an ID where a
          plain volume does not, and it is why they carry these two
          timestamps as well.
    updated_at:
      extra:
        - The same, for the last change.

API::Docker::Type::Limit:
  attr:
    nano_cpus:
      extra:
        - >-
          A CPU quota in units of 10^-9 CPUs, which is how the
          swagger describes the same measure under
          L<API::Docker::Type::Resources/nano_cpus>. The example
          C<4000000000> is four whole CPUs.
    memory_bytes:
      extra:
        - >-
          A memory limit in bytes, the measure the swagger describes under
          L<API::Docker::Type::Resources/memory>. The example C<8272408576>
          is roughly 7.7 GiB.

API::Docker::Type::ResourceObject:
  attr:
    nano_cpus:
      extra:
        - >-
          The same units and the same example as
          L<API::Docker::Type::Limit/nano_cpus>: C<4000000000> is four whole
          CPUs.
    memory_bytes:
      extra:
        - >-
          Bytes, and the same example as
          L<API::Docker::Type::Limit/memory_bytes>.

API::Docker::Type::Topology:
  attr:
    segments:
      extra:
        - >-
          The map itself -- topological domains for keys, topological
          segments for values, which is what the definition above says the
          object is. The swagger sends you to the CSI specification's own
          Topology object for what those are.

API::Docker::Type::Node:
  attr:
    id:
      extra:
        - >-
          The node's ID in the swarm, C<24ifsmvkjbyhk> in the swagger's
          example, and what the C</nodes/{id}> endpoints take in their path.
    spec:
      extra:
        - >-
          The name, role, availability and labels an operator set on the node
          -- C<< {"Name": "node-name", "Role": "manager", "Availability":
          "active", "Labels": {"foo": "bar"}} >> in that definition's own
          example. L</description> is what the node itself reports back
          instead.

API::Docker::Type::NodeDescription:
  attr:
    hostname:
      extra:
        - >-
          The node's hostname, C<bf3067039e47> in the swagger's example. As
          the definition above says, it is what the agent reports, not what a
          manager was told.

API::Docker::Type::NodeStatus:
  attr:
    message:
      extra:
        - >-
          Free text about the node from the manager that watches it -- the
          human-readable half of L</state>. The swagger's example is the empty
          string.

API::Docker::Type::ManagerStatus:
  attr:
    leader:
      extra:
        - >-
          Of the manager component this class describes: whether it is the one
          leading. Defaulted to C<false> upstream and C<true> in the example.

API::Docker::Type::EngineDescription:
  attr:
    engine_version:
      extra:
        - >-
          The engine's version as the node's agent reports it, C<17.06.0> in
          the swagger's example -- the value C<GET /version> answers as
          L<API::Docker::Type::SystemVersion/version>.
    labels:
      extra:
        - >-
          The engine's own labels, C<< {"foo": "bar"} >> in the swagger's
          example. These are the C<engine.labels> a task placement constraint
          can match on; see
          L<API::Docker::Type::TaskSpec::Placement/constraints>.
    plugins:
      extra:
        - >-
          One entry per plugin the engine has. The swagger's example lists
          seventeen -- eight C<Log>, six C<Network> and three C<Volume>.
          C<GET /info> reports the same ground in a different shape, as
          L<API::Docker::Type::PluginsInfo>.

API::Docker::Type::EngineDescription::Plugin:
  attr:
    type:
      extra:
        - >-
          What the plugin plugs into: C<Log>, C<Network> and C<Volume> are the
          three the swagger's example uses.
    name:
      extra:
        - >-
          Its name -- a bare word for the built-in drivers (C<json-file>,
          C<overlay>, C<local>), and a full image reference for an installed
          one: C<localhost:5000/vieux/sshfs:latest> in the same example.

API::Docker::Type::SwarmInfo:
  attr:
    control_available:
      extra:
        - >-
          A boolean, defaulted to C<false> upstream and C<true> in the
          example, standing beside L</local_node_state> and L</managers>.
          Measured against Podman 5.8.4 (API 1.44), C<GET /info> answers a
          complete C<Swarm> block -- C<ControlAvailable> C<false>,
          C<LocalNodeState> C<inactive> -- on an engine running no swarm at
          all.
    error:
      extra:
        - >-
          Defaulted to the empty string upstream, which is also what that same
          Podman 5.8.4 measurement answers.

API::Docker::Type::ContainerStatus:
  attr:
    container_id:
      extra:
        - >-
          The container a swarm task is running in -- the object hangs off
          L<API::Docker::Type::TaskStatus/container_status> -- and an ordinary
          container ID that C<GET /containers/{id}/json> will take. The
          swagger's C<Task> example carries a 64-character hex digest.
    pid:
      extra:
        - >-
          Its process ID, the measure the swagger describes under
          L<API::Docker::Type::ContainerState/pid>. C<677> in the swagger's
          C<Task> example.
    exit_code:
      extra:
        - >-
          Its last exit code, the measure the swagger describes under
          L<API::Docker::Type::ContainerState/exit_code>. Absent from the
          C<Task> example, whose container is still running.

API::Docker::Type::EndpointPortConfig:
  attr:
    protocol:
      extra:
        - >-
          The transport protocol of the published port, C<tcp> in the
          swagger's C<Service> example. The same enumeration appears on a
          container's own port list as L<API::Docker::Type::Port/type>.

API::Docker::Type::PortStatus:
  attr:
    ports:
      extra:
        - >-
          The published ports themselves, the same entries a service carries
          under L<API::Docker::Type::Service::Endpoint/ports>.

API::Docker::Type::Service:
  attr:
    id:
      extra:
        - >-
          The service's ID, C<9mnpnzenvg8p8tdbtq4wvbkcz> in the swagger's
          example -- the value that example's companion C<Task> repeats as its
          C<ServiceID>.
    created_at:
      extra:
        - >-
          RFC 3339 with nanoseconds, C<2016-06-07T21:05:51.880065305Z> in the
          swagger's example.
    updated_at:
      extra:
        - >-
          The same format, and in that example some ninety-eight seconds
          later than L</created_at>.
    endpoint:
      extra:
        - >-
          The ports and virtual IPs the swarm actually gave the service. What
          was asked for is the C<EndpointSpec> inside L</spec>, and the
          endpoint repeats it as its own C<Spec> -- in the swagger's example
          all three copies of the port entry agree.

API::Docker::Type::Service::Endpoint::VirtualIP:
  attr:
    network_id:
      extra:
        - >-
          The network the address is on, C<4qvuz4ko70xaltuqbt8956gd1> on both
          entries of the swagger's C<Service> example.
    addr:
      extra:
        - >-
          The address with its prefix length, C<10.255.0.2/16> in that
          example -- CIDR, the way
          L<API::Docker::Type::NetworkContainer/ipv4_address> is and
          L<API::Docker::Type::EndpointSettings/ip_address> is not.

API::Docker::Type::Service::UpdateStatus:
  attr:
    state:
      extra:
        - >-
          How far the rolling update has got. L</started_at> and
          L</completed_at> bracket it in time and L</message> says in words
          what it is doing.
    started_at:
      extra:
        - RFC 3339, with no example given.
    completed_at:
      extra:
        - The other end of L</started_at>, in the same format.
    message:
      extra:
        - Free text about the update, the human-readable half of L</state>.

API::Docker::Type::ServiceSpec::Mode:
  attr:
    replicated:
      extra:
        - >-
          The mode for a service with a fixed number of tasks; the count is
          L<API::Docker::Type::ServiceSpec::Mode::Replicated/replicas>, and
          the swagger's C<Service> example carries C<< {"Replicated":
          {"Replicas": 1}} >>. Of the four modes only C<ReplicatedJob> and
          C<GlobalJob> are described upstream.
    global:
      extra:
        - >-
          One task on every valid node: the same reach the swagger gives
          C<GlobalJob>, which it describes as running a task to the completed
          state on each valid node, without the running-to-completion part. An
          empty object -- naming the mode is the whole of it.

API::Docker::Type::Task:
  attr:
    created_at:
      extra:
        - >-
          RFC 3339 with nanoseconds, C<2016-06-07T21:07:31.171892745Z> in the
          swagger's example.
    updated_at:
      extra:
        - >-
          The same format, two hundred milliseconds later in that example --
          the task was created and then reported running.
    slot:
      extra:
        - >-
          C<1> in the swagger's example, whose C<ServiceID> is the same
          C<9mnpnzenvg8p8tdbtq4wvbkcz> the C<Service> example carries, and
          that service asks for one replica. Read it as which replica of the
          service this task is.
    desired_state:
      extra:
        - >-
          Where the orchestrator wants the task, against
          L<API::Docker::Type::TaskStatus/state> which is where it actually
          is. Both are C<running> in the swagger's example.

API::Docker::Type::TaskStatus:
  attr:
    timestamp:
      extra:
        - >-
          When L</state> was observed: C<2016-06-07T21:07:31.290032978Z> in
          the swagger's C<Task> example,
          between that task's L<API::Docker::Type::Task/created_at> and its
          L<API::Docker::Type::Task/updated_at>.
    state:
      extra:
        - >-
          Where the task actually is, against the
          L<API::Docker::Type::Task/desired_state> the orchestrator wants.
          Both are C<running> in the swagger's example.
    message:
      extra:
        - >-
          Free text about that state, C<"started"> in the swagger's C<Task>
          example.
    err:
      extra:
        - >-
          The failure, as text. The swagger's C<Task> example shows a task
          that started and carries no C<Err> at all, only L</message>.

API::Docker::Type::TaskSpec:
  attr:
    placement:
      extra:
        - >-
          Empty (C<{}>) in both the C<Service> and the C<Task> example, which
          restrict nothing.

API::Docker::Type::TaskSpec::ContainerSpec::Privileges::AppArmor:
  attr:
    mode:
      extra:
        - >-
          The whole of what this object configures: AppArmor left at the
          engine's default, or turned off.

API::Docker::Type::TaskSpec::ContainerSpec::Privileges::Seccomp:
  attr:
    mode:
      extra:
        - >-
          Which of the three the container gets. C<custom> is the one that
          gives L</profile> a job -- the swagger describes that field as the
          custom seccomp profile, as a JSON object.

API::Docker::Type::TaskSpec::LogDriver:
  attr:
    name:
      extra:
        - >-
          The driver, named the way
          L<API::Docker::Type::HostConfig::LogConfig/type> names it for a
          container. The field holding this object says an absent log driver
          falls back to the swarm's default and then to the engine's.
    options:
      extra:
        - >-
          Driver-specific options, the same shape
          L<API::Docker::Type::HostConfig::LogConfig/config> takes for a
          container, whose example is C<< {"max-file": "5", "max-size": "10m"}
          >>.

API::Docker::Type::TaskSpec::PluginSpec:
  attr:
    plugin_privilege:
      extra:
        - >-
          The permissions installing the plugin requires the user to accept,
          one entry per permission. The other three fields of this spec --
          C<Name>, C<Remote> and C<Disabled> -- are described upstream; this
          one is not.
